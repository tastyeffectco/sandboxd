# Publish the three sandboxd images to GHCR, multi-arch, on a version tag.
#
# Trigger: pushing a stable tag like `v0.4.0` (or a manual run on that
# same tag). Each image is built for linux/amd64 + linux/arm64, pushed to
# ghcr.io/<owner>/<image>:<version>, given a SLSA build-provenance attestation
# and an SBOM, and signed keylessly with cosign (Sigstore OIDC — no stored
# keys). Consumers can verify: image == this tag == this workflow.
#
# The installer prefers these images (fast path) and falls back to building
# from source when they're absent — so `--build` stays a first-class path for
# self-hosters who compile everything themselves.
name: release-images

on:
  push:
    tags: ['v*']
  # Manual runs must select the same stable release tag as automatic runs.
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # push to GHCR
  id-token: write      # cosign keyless (Sigstore OIDC)

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base image: context is the repo root so the runtimed build stage
          # can see control-plane/ (see image/Dockerfile, multi-stage).
          - name: sandboxd-base
            context: .
            dockerfile: image/Dockerfile
          - name: sandboxd-control-plane
            context: ./control-plane
            dockerfile: ./control-plane/Dockerfile
          - name: sandboxd-console
            context: ./console
            dockerfile: ./console/Dockerfile
    steps:
      - name: Require a stable release tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select a stable vMAJOR.MINOR.PATCH tag; branch/manual version overrides are not allowed." >&2
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v3        # arm64 emulation on amd64 runners
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3       # cosign on PATH, correct version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch, provenance + SBOM)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.ver.outputs.version }}
          provenance: mode=max   # SLSA build provenance
          sbom: true
          # buildvcs off — the base image's runtimed stage builds from a bind
          # context without .git; mirrors image/build.sh + local builds.
          build-args: |
            GOFLAGS=-buildvcs=false
            VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ github.sha }}

      - name: Sign the pushed image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_VERSION: ${{ steps.ver.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published **%s:%s**\n- digest: `%s`\n- cosign signature, provenance and SBOM\n' \
            "$IMAGE_NAME" "$IMAGE_VERSION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
